[package]
name = "ruask"
version = "0.1.0"
edition = "2024"
description = "A command-line assistant for command lookup and command output explanation"
repository = "https://github.com/KevinGuo1007/ruask"
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "src/**/*.rs",
    "tests/**/*.rs",
    "docs/development.md",
    "docs/testing.md",
    "docs/performance.md",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
toml = "1.1.8"
ureq = { version = "3", features = ["json"] }
flate2 = "1.1"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
libc = "0.2"
mockito = "1.7"
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
